name: gatekeeper_openwrt
description: GateKeeper for OpenWrt router management.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/gatekeeper_monochrome.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/gatekeeper_icon_square.png
  remove_alpha_ios: true
  adaptive_icon_background: '#0B2545'
  adaptive_icon_foreground: assets/icon/gatekeeper_foreground.png
  adaptive_icon_monochrome: assets/icon/gatekeeper_monochrome.png
